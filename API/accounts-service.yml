openapi: 3.0.3

info:
  title: Yanki Accounts Service API
  description: |
    API REST reactiva para la gestión de cuentas bancarias del ecosistema Yanki Platform.

    Soporta tres tipos de productos pasivos:
    - **Cuenta de Ahorro (SAVINGS)**: Libre de comisión, con límite de 10 movimientos gratuitos por mes. Disponible para clientes PERSONAL y perfil VIP.
    - **Cuenta Corriente (CURRENT)**: Con comisión de mantenimiento mensual ($15.00 PEN), sin límite de movimientos. Disponible para clientes PERSONAL y ENTERPRISE.
    - **Cuenta a Plazo Fijo (TERM_FIXED)**: Con día específico permitido para movimientos. Disponible para clientes PERSONAL.

    ### Características principales
    - Arquitectura hexagonal con puertos y adaptadores
    - Comunicación event-driven vía Apache Kafka (sin llamadas REST entre microservicios)
    - Caché de saldos con Redis
    - Idempotencia en consumidores Kafka
    - Circuit Breaker con Resilience4j
    - Descubrimiento de servicios con Eureka
    - Documentación OpenAPI 3.0 con SpringDoc

    ### Errores
    Todos los errores de negocio retornan HTTP 409 Conflict con un cuerpo `ApiError` que incluye
    un código de error estandarizado (`code`) para identificación programática.
    Los errores de validación de entrada retornan HTTP 400 Bad Request.
    Los errores internos no controlados retornan HTTP 500 Internal Server Error.

    ### Autenticación
    La autenticación JWT es delegada al API Gateway. En desarrollo local, los endpoints
    pueden accederse sin token.

  version: 1.0.0
  contact:
    name: Sebastián Retamal
    email: semorale@emeal.nttdata.com
  license:
    name: Propietario
    url: https://yanki.platform

servers:
  - url: http://localhost:8081
    description: Servidor local de desarrollo
  - url: https://api-staging.yanki.platform/accounts-service
    description: Entorno de staging
  - url: https://api.yanki.platform/accounts-service
    description: Entorno de producción

tags:
  - name: Accounts
    description: Operaciones CRUD y consultas de cuentas bancarias
  - name: Account Operations
    description: Depósitos y retiros en cuentas bancarias
  - name: Account Admin
    description: Jobs administrativos y consultas de contadores

paths:

###############################################################################
# CU-02: Gestión de Cuentas
###############################################################################

  /api/accounts:
    post:
      tags:
        - Accounts
      summary: Abre una nueva cuenta bancaria
      description: |
        Crea una nueva cuenta bancaria (ahorro, corriente o plazo fijo) para un cliente existente.

        **Validaciones de negocio:**
        - El cliente no debe tener deuda vencida (verificado vía Kafka — customer_risk_view)
        - Un cliente PERSONAL no puede tener más de 1 cuenta SAVINGS ni más de 1 cuenta CURRENT
        - Un cliente ENTERPRISE no puede abrir cuentas SAVINGS ni TERM_FIXED
        - El perfil VIP requiere tarjeta crédito activa asociada
        - El perfil PYME requiere tarjeta crédito asociada

        **Eventos publicados:** `account.opened.v1` en Kafka.

        **Casos de prueba:** CP-020, CP-021, CP-024, CP-025, CP-029, CP-131, CP-132, CP-133
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountRequest'
            examples:
              savings-personal:
                summary: Cuenta de ahorro personal
                value:
                  customerId: "CUST001"
                  type: "SAVINGS"
                  currency: "PEN"
                  initialAmount: 500.00
                  channel: "WEB"
              term-fixed:
                summary: Cuenta a plazo fijo
                value:
                  customerId: "CUST001"
                  type: "TERM_FIXED"
                  currency: "USD"
                  initialAmount: 10000.00
                  termDays: 90
                  allowedMovementDay: 15
                  channel: "BRANCH"
              current-enterprise:
                summary: Cuenta corriente empresarial
                value:
                  customerId: "CUST-ENT-001"
                  type: "CURRENT"
                  currency: "PEN"
                  initialAmount: 5000.00
                  channel: "BRANCH"
                  holders:
                    - holderId: "HOLDER001"
                      percentage: 60
                      principal: true
                    - holderId: "HOLDER002"
                      percentage: 40
                      principal: false
                  signers:
                    - signerId: "SIGNER001"
                      operationLimit: 10000.00
                      active: true
      responses:
        '201':
          description: Cuenta creada exitosamente. Se genera un número de cuenta único y se publica el evento account.opened.v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
              example:
                accountId: "ACC001"
                accountNumber: "ACC123456789"
                accountType: "SAVINGS"
                status: "OPEN"
                balance: 500.00
                currency: "PEN"
                openedAt: "2026-11-15T10:30:00"
                closedAt: null
                customerId: "CUST001"
                holders: null
                signers: null
        '400':
          description: Datos de solicitud inválidos. Verifique los campos obligatorios y los formatos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 400
                error: "Bad Request"
                code: "VALIDATION_ERROR"
                message: "Datos de entrada inválidos"
                path: "/api/accounts"
                details:
                  customerId: "Customer ID es obligatorio"
                  type: "Tipo de cuenta es obligatorio"
        '409':
          description: |
            Regla de negocio violada. Códigos de error posibles:
            - `SAVINGS_ACCOUNT_ALREADY_EXISTS`: El cliente ya tiene una cuenta de ahorro
            - `CURRENT_ACCOUNT_PERSONAL_LIMIT`: El cliente PERSONAL ya tiene una cuenta corriente
            - `ENTERPRISE_CANNOT_HAVE_SAVINGS`: Cliente ENTERPRISE no puede tener cuenta SAVINGS
            - `ENTERPRISE_CANNOT_HAVE_TERM_FIXED`: Cliente ENTERPRISE no puede tener cuenta TERM_FIXED
            - `CREDIT_CARD_REQUIRED_FOR_VIP`: Perfil VIP requiere tarjeta crédito activa
            - `CREDIT_CARD_REQUIRED_FOR_PYME`: Perfil PYME requiere tarjeta crédito
            - `CUSTOMER_HAS_OVERDUE_DEBT`: El cliente tiene deuda vencida
            - `CUSTOMER_NOT_FOUND`: El cliente no existe en el sistema
            - `CUSTOMER_INACTIVE`: El cliente no está activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                savings-already-exists:
                  summary: Cuenta de ahorro ya existe
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "SAVINGS_ACCOUNT_ALREADY_EXISTS"
                    message: "El cliente ya tiene una cuenta de ahorro activa"
                    path: "/api/accounts"
                enterprise-cannot-have-savings:
                  summary: Enterprise no puede tener SAVINGS
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "ENTERPRISE_CANNOT_HAVE_SAVINGS"
                    message: "Los clientes ENTERPRISE no pueden abrir cuentas de ahorro"
                    path: "/api/accounts"
                vip-credit-card-required:
                  summary: VIP requiere tarjeta crédito
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "CREDIT_CARD_REQUIRED_FOR_VIP"
                    message: "El perfil VIP requiere una tarjeta crédito activa"
                    path: "/api/accounts"

    get:
      tags:
        - Accounts
      summary: Lista cuentas con filtros y paginación
      description: |
        Retorna una lista paginada de cuentas bancarias aplicando los filtros proporcionados.
        Los filtros se combinan mediante el patrón Strategy y soportan cualquier combinación
        de `customerId`, `type` y `status`. Si no se proporcionan filtros, retorna todas las cuentas.

        **Casos de prueba:** CP-034
      operationId: findAllAccounts
      parameters:
        - name: customerId
          in: query
          required: false
          description: Filtrar por identificador del cliente propietario.
          schema:
            type: string
            example: "CUST001"
        - name: type
          in: query
          required: false
          description: Filtrar por tipo de cuenta.
          schema:
            type: string
            enum:
              - SAVINGS
              - CURRENT
              - TERM_FIXED
            example: "SAVINGS"
        - name: status
          in: query
          required: false
          description: Filtrar por estado de la cuenta.
          schema:
            type: string
            enum:
              - OPEN
              - CLOSED
              - BLOCKED
            example: "OPEN"
        - name: page
          in: query
          required: false
          description: Número de página (base 0).
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página (máximo 100).
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
      responses:
        '200':
          description: Lista de cuentas encontradas con metadatos de paginación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseOfAccountResponse'
              example:
                content:
                  - accountId: "ACC001"
                    accountNumber: "ACC123456789"
                    accountType: "SAVINGS"
                    status: "OPEN"
                    balance: 1500.00
                    currency: "PEN"
                    openedAt: "2026-01-15T10:30:00"
                    closedAt: null
                    customerId: "CUST001"
                    holders: null
                    signers: null
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
                first: true
                last: true

  /api/accounts/{id}:
    get:
      tags:
        - Accounts
      summary: Obtiene una cuenta por ID
      description: |
        Retorna la información completa de una cuenta bancaria identificada por su ID único,
        incluyendo saldo, moneda, estado y, para cuentas empresariales, la lista de titulares y firmantes.

        **Casos de prueba:** CP-034
      operationId: findAccountById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta.
          schema:
            type: string
            example: "ACC001"
      responses:
        '200':
          description: Cuenta encontrada con todos sus detalles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "ACCOUNT_NOT_FOUND"
                message: "No se encontró la cuenta ACC999"
                path: "/api/accounts/ACC999"

    delete:
      tags:
        - Accounts
      summary: Cierra una cuenta (saldo debe ser 0)
      description: |
        Cierra una cuenta bancaria activa. El saldo debe ser exactamente 0 para poder cerrar la cuenta.
        Al cerrar, el estado cambia a CLOSED, se registra la fecha de cierre y se publica el evento `account.closed.v1`.

        **Casos de prueba:** CP-035, CP-036
      operationId: closeAccount
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta a cerrar.
          schema:
            type: string
            example: "ACC001"
      responses:
        '204':
          description: Cuenta cerrada exitosamente. El estado cambia a CLOSED.
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "ACCOUNT_NOT_FOUND"
                message: "No se encontró la cuenta ACC999"
                path: "/api/accounts/ACC999"
        '409':
          description: |
            El saldo de la cuenta no es 0. Realice operaciones para vaciar el saldo antes de cerrar.
            Códigos de error posibles:
            - `ACCOUNT_CANNOT_CLOSE_BALANCE_NOT_ZERO`: Saldo distinto de cero
            - `ACCOUNT_ALREADY_CLOSED`: La cuenta ya está cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                balance-not-zero:
                  summary: Saldo no es cero
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "ACCOUNT_CANNOT_CLOSE_BALANCE_NOT_ZERO"
                    message: "No se puede cerrar la cuenta: el saldo no es cero (saldo actual: 500.00)"
                    path: "/api/accounts/ACC001"
                already-closed:
                  summary: Cuenta ya cerrada
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "ACCOUNT_ALREADY_CLOSED"
                    message: "La cuenta ya está cerrada"
                    path: "/api/accounts/ACC001"

###############################################################################
# CU-08: Consulta de Saldos
###############################################################################

  /api/accounts/{id}/balance:
    get:
      tags:
        - Accounts
      summary: Consulta el saldo disponible de una cuenta
      description: |
        Retorna el saldo actual de una cuenta bancaria. El valor se obtiene desde caché Redis
        si está disponible, o directamente desde MongoDB si no. El campo `cached` indica la fuente del dato.

        **Casos de prueba:** CP-049, CP-050, CP-053
      operationId: getAccountBalance
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta.
          schema:
            type: string
            example: "ACC001"
      responses:
        '200':
          description: Saldo consultado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
              examples:
                cache-miss:
                  summary: Saldo desde MongoDB (cache miss)
                  value:
                    accountId: "ACC001"
                    balance: 1500.00
                    currency: "PEN"
                    cached: false
                cache-hit:
                  summary: Saldo desde Redis (cache hit)
                  value:
                    accountId: "ACC001"
                    balance: 1500.00
                    currency: "PEN"
                    cached: true
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "ACCOUNT_NOT_FOUND"
                message: "No se encontró la cuenta ACC999"
                path: "/api/accounts/ACC999/balance"

###############################################################################
# CU-09: Consulta de Movimientos
###############################################################################

  /api/accounts/{id}/movements:
    get:
      tags:
        - Accounts
      summary: Lista movimientos de una cuenta con paginación y filtros
      description: |
        Retorna una lista paginada de movimientos bancarios de una cuenta específica.
        Soporta filtros por rango de fechas y tipo de movimiento.

        **Tipos de movimiento:** DEPOSIT, WITHDRAWAL, TRANSFER_IN, TRANSFER_OUT, COMMISSION, PAYMENT, INTEREST

        **Casos de prueba:** CP-054, CP-055
      operationId: getAccountMovements
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta.
          schema:
            type: string
            example: "ACC001"
        - name: from
          in: query
          required: false
          description: Fecha de inicio del filtro (inclusive). Formato ISO 8601.
          schema:
            type: string
            format: date-time
            example: "2026-01-01T00:00:00"
        - name: to
          in: query
          required: false
          description: Fecha de fin del filtro (inclusive). Formato ISO 8601.
          schema:
            type: string
            format: date-time
            example: "2026-11-14T23:59:59"
        - name: type
          in: query
          required: false
          description: Filtrar por tipo de movimiento.
          schema:
            type: string
            enum:
              - DEPOSIT
              - WITHDRAWAL
              - TRANSFER_IN
              - TRANSFER_OUT
              - COMMISSION
              - PAYMENT
              - INTEREST
            example: "DEPOSIT"
        - name: page
          in: query
          required: false
          description: Número de página (base 0).
          schema:
            type: integer
            default: 0
            minimum: 0
            example: 0
        - name: size
          in: query
          required: false
          description: Tamaño de página (máximo 100).
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
            example: 20
      responses:
        '200':
          description: Lista de movimientos encontrados con metadatos de paginación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponseOfMovementResponse'
              example:
                content:
                  - movementId: "MOV001"
                    accountId: "ACC001"
                    movementType: "DEPOSIT"
                    amount: 500.00
                    balanceAfter: 1500.00
                    commission: 0.00
                    description: "Depósito de sueldo"
                    occurredAt: "2026-11-14T10:30:00"
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
                first: true
                last: true
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                timestamp: "2026-11-15T10:30:00"
                status: 404
                error: "Not Found"
                code: "ACCOUNT_NOT_FOUND"
                message: "No se encontró la cuenta ACC999"
                path: "/api/accounts/ACC999/movements"

###############################################################################
# CU-05: Operaciones (Depósitos y Retiros)
###############################################################################

  /api/accounts/{id}/deposits:
    post:
      tags:
        - Account Operations
      summary: Realiza un depósito en la cuenta
      description: |
        Acredita un monto a la cuenta especificada. El depósito incrementa el saldo disponible
        inmediatamente y genera un movimiento de tipo DEPOSIT. Se publica el evento `account.deposited.v1`.

        **Casos de prueba:** CP-037, CP-038, CP-042
      operationId: depositToAccount
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta.
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepositRequest'
            example:
              amount: 500.00
              description: "Depósito de sueldo"
              channel: "WEB"
              referenceId: "REF001"
      responses:
        '201':
          description: Depósito realizado exitosamente. El saldo se actualiza inmediatamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
              example:
                movementId: "MOV001"
                accountId: "ACC001"
                movementType: "DEPOSIT"
                amount: 500.00
                balanceAfter: 1500.00
                commission: 0.00
                description: "Depósito de sueldo"
                occurredAt: "2026-11-15T10:30:00"
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: La cuenta está bloqueada o cerrada y no puede recibir depósitos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                account-blocked:
                  summary: Cuenta bloqueada
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "ACCOUNT_BLOCKED"
                    message: "La cuenta está bloqueada"
                    path: "/api/accounts/ACC001/deposits"
                account-closed:
                  summary: Cuenta cerrada
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "ACCOUNT_ALREADY_CLOSED"
                    message: "La cuenta ya está cerrada"
                    path: "/api/accounts/ACC001/deposits"

  /api/accounts/{id}/withdrawals:
    post:
      tags:
        - Account Operations
      summary: Realiza un retiro de la cuenta
      description: |
        Debita un monto de la cuenta especificada. Valida saldo suficiente, límites diarios/mensuales,
        reglas de movimientos excedentes y comisiones aplicables. Genera un movimiento de tipo WITHDRAWAL.
        Se publica el evento `account.withdrawn.v1`.

        **Comisiones:** Si la cuenta SAVINGS ha excedido los 10 movimientos gratuitos del mes,
        se aplica una comisión por movimiento excedente.

        **Casos de prueba:** CP-040, CP-041, CP-043
      operationId: withdrawFromAccount
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta.
          schema:
            type: string
            example: "ACC001"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawalRequest'
            example:
              amount: 200.00
              description: "Retiro en cajero"
              channel: "ATM"
              referenceId: "REF002"
      responses:
        '201':
          description: Retiro realizado exitosamente. El saldo se actualiza inmediatamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementResponse'
              examples:
                withdrawal-without-commission:
                  summary: Retiro sin comisión
                  value:
                    movementId: "MOV002"
                    accountId: "ACC001"
                    movementType: "WITHDRAWAL"
                    amount: 200.00
                    balanceAfter: 1300.00
                    commission: 0.00
                    description: "Retiro en cajero"
                    occurredAt: "2026-11-15T11:00:00"
                withdrawal-with-commission:
                  summary: Retiro con comisión por exceso de movimientos
                  value:
                    movementId: "MOV011"
                    accountId: "ACC001"
                    movementType: "WITHDRAWAL"
                    amount: 100.00
                    balanceAfter: 1190.00
                    commission: 2.00
                    description: "Retiro con comisión por exceso"
                    occurredAt: "2026-11-15T12:00:00"
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            Saldo insuficiente, límites excedidos, cuenta bloqueada o reglas de negocio violadas.
            Códigos de error posibles:
            - `ACCOUNT_INSUFFICIENT_BALANCE`: Saldo insuficiente para el retiro
            - `ACCOUNT_BLOCKED`: La cuenta está bloqueada
            - `ACCOUNT_ALREADY_CLOSED`: La cuenta ya está cerrada
            - `EXCEEDED_FREE_MOVEMENTS`: Se aplicó comisión por exceso de movimientos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                insufficient-balance:
                  summary: Saldo insuficiente
                  value:
                    timestamp: "2026-11-15T10:30:00"
                    status: 409
                    error: "Conflict"
                    code: "ACCOUNT_INSUFFICIENT_BALANCE"
                    message: "Saldo insuficiente para retirar 5000.00 (saldo actual: 500.00)"
                    path: "/api/accounts/ACC001/withdrawals"

###############################################################################
# CU-15: Comisiones y Admin
###############################################################################

  /api/accounts/jobs/maintenance-commission:
    post:
      tags:
        - Account Admin
      summary: Ejecuta manualmente el job de comisiones de mantenimiento
      description: |
        Dispara la ejecución inmediata del job que aplica las comisiones de mantenimiento
        mensual a todas las cuentas corriente con `maintenanceCommission > 0`.
        Usado por administradores para pruebas y recuperación.

        **Casos de prueba:** CP-139
      operationId: triggerMaintenanceCommission
      responses:
        '204':
          description: Job de comisiones de mantenimiento ejecutado exitosamente.

  /api/accounts/jobs/vip-average-check:
    post:
      tags:
        - Account Admin
      summary: Ejecuta manualmente el job de verificación de promedio VIP
      description: |
        Dispara la ejecución inmediata del job que verifica el promedio diario del mes anterior
        para cuentas VIP. Si el promedio está por debajo del mínimo, aplica la penalidad correspondiente.
        Usado por administradores para pruebas y recuperación.

        **Casos de prueba:** CP-140
      operationId: triggerVipAverageCheck
      responses:
        '204':
          description: Job de verificación de promedio VIP ejecutado exitosamente.

  /api/accounts/{id}/movement-count:
    get:
      tags:
        - Account Admin
      summary: Obtiene el contador de movimientos del mes actual
      description: |
        Retorna la cantidad de movimientos realizados en la cuenta durante el mes en curso.
        Útil para verificar el límite de movimientos gratuitos antes de realizar una operación.

        **Casos de prueba:** CP-142
      operationId: getMovementCount
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único de la cuenta.
          schema:
            type: string
            example: "ACC001"
      responses:
        '200':
          description: Contador de movimientos del mes actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MovementCountResponse'
              example:
                accountId: "ACC001"
                movementCount: 5
                month: "2026-11"
        '404':
          description: No se encontró una cuenta con el ID proporcionado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

###############################################################################
# Components / Schemas
###############################################################################

components:
  schemas:

    AccountRequest:
      type: object
      required:
        - customerId
        - type
        - currency
        - initialAmount
      properties:
        customerId:
          type: string
          description: Identificador único del cliente propietario de la cuenta.
          example: "CUST001"
        type:
          type: string
          description: Tipo de cuenta a abrir.
          enum:
            - SAVINGS
            - CURRENT
            - TERM_FIXED
          example: "SAVINGS"
        currency:
          type: string
          description: Moneda de la cuenta.
          enum:
            - PEN
            - USD
          example: "PEN"
        initialAmount:
          type: number
          format: decimal
          minimum: 0
          description: Monto inicial con el que se abre la cuenta. Debe ser mayor o igual a 0.
          example: 500.00
        termDays:
          type: integer
          description: Plazo en días para cuentas a plazo fijo (TERM_FIXED). Obligatorio si el tipo es TERM_FIXED.
          nullable: true
          example: 90
        allowedMovementDay:
          type: integer
          minimum: 1
          maximum: 28
          description: Día del mes permitido para movimientos en cuentas a plazo fijo (1-28). Obligatorio si el tipo es TERM_FIXED.
          nullable: true
          example: 15
        holders:
          type: array
          maxItems: 10
          description: Lista de titulares para cuentas empresariales (CURRENT de tipo ENTERPRISE). Máximo 10 titulares.
          nullable: true
          items:
            $ref: '#/components/schemas/AccountHolderRequest'
        signers:
          type: array
          maxItems: 20
          description: Lista de firmantes autorizados para cuentas empresariales. Máximo 20 firmantes.
          nullable: true
          items:
            $ref: '#/components/schemas/AccountSignerRequest'
        channel:
          type: string
          description: Canal desde donde se realiza la apertura.
          enum:
            - BRANCH
            - MOBILE
            - WEB
          example: "WEB"

    AccountHolderRequest:
      type: object
      description: Titular de cuenta empresarial con porcentaje de propiedad.
      properties:
        holderId:
          type: string
          description: Identificador del titular.
          example: "HOLDER001"
        percentage:
          type: integer
          minimum: 0
          maximum: 100
          description: Porcentaje de propiedad del titular (0-100).
          example: 50
        principal:
          type: boolean
          description: Indica si es el titular principal de la cuenta.
          example: true

    AccountSignerRequest:
      type: object
      description: Firmante autorizado de cuenta empresarial con límite de operación.
      properties:
        signerId:
          type: string
          description: Identificador del firmante.
          example: "SIGNER001"
        operationLimit:
          type: number
          format: decimal
          description: Límite máximo de operación autorizado para el firmante.
          example: 10000.00
        active:
          type: boolean
          description: Indica si el firmante está activo.
          example: true

    AccountResponse:
      type: object
      description: Respuesta con la información completa de una cuenta bancaria.
      properties:
        accountId:
          type: string
          description: Identificador único de la cuenta.
          example: "ACC001"
        accountNumber:
          type: string
          description: Número visible de la cuenta para el cliente.
          example: "ACC123456789"
        accountType:
          type: string
          description: Tipo de cuenta.
          enum:
            - SAVINGS
            - CURRENT
            - TERM_FIXED
          example: "SAVINGS"
        status:
          type: string
          description: Estado actual de la cuenta.
          enum:
            - OPEN
            - CLOSED
            - BLOCKED
          example: "OPEN"
        balance:
          type: number
          format: decimal
          description: Saldo actual de la cuenta.
          example: 1000.00
        currency:
          type: string
          description: Moneda de la cuenta.
          enum:
            - PEN
            - USD
          example: "PEN"
        openedAt:
          type: string
          format: date-time
          description: Fecha y hora de apertura de la cuenta.
          example: "2026-01-15T10:30:00"
        closedAt:
          type: string
          format: date-time
          description: Fecha y hora de cierre de la cuenta. Null si la cuenta está abierta.
          nullable: true
          example: "2026-06-01T14:00:00"
        customerId:
          type: string
          description: Identificador del cliente propietario de la cuenta.
          example: "CUST001"
        holders:
          type: array
          description: Lista de titulares para cuentas empresariales.
          nullable: true
          items:
            $ref: '#/components/schemas/AccountHolderResponse'
        signers:
          type: array
          description: Lista de firmantes autorizados para cuentas empresariales.
          nullable: true
          items:
            $ref: '#/components/schemas/AccountSignerResponse'

    AccountHolderResponse:
      type: object
      description: Titular de cuenta empresarial con porcentaje de propiedad.
      properties:
        holderId:
          type: string
          description: Identificador del titular.
          example: "HOLDER001"
        percentage:
          type: integer
          description: Porcentaje de propiedad del titular (0-100).
          example: 50
        principal:
          type: boolean
          description: Indica si es el titular principal.
          example: true

    AccountSignerResponse:
      type: object
      description: Firmante autorizado de cuenta empresarial.
      properties:
        signerId:
          type: string
          description: Identificador del firmante.
          example: "SIGNER001"
        operationLimit:
          type: number
          format: decimal
          description: Límite máximo de operación autorizado.
          example: 10000.00
        active:
          type: boolean
          description: Indica si el firmante está activo.
          example: true

    DepositRequest:
      type: object
      required:
        - amount
        - channel
      properties:
        amount:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          description: Monto a depositar. Debe ser mayor a 0.
          example: 500.00
        description:
          type: string
          description: Descripción opcional del motivo del depósito.
          nullable: true
          example: "Depósito de sueldo"
        channel:
          type: string
          description: Canal desde donde se realiza el depósito.
          enum:
            - BRANCH
            - ATM
            - MOBILE
            - WEB
          example: "WEB"
        referenceId:
          type: string
          description: Referencia externa para trazabilidad del depósito.
          nullable: true
          example: "REF001"

    WithdrawalRequest:
      type: object
      required:
        - amount
        - channel
      properties:
        amount:
          type: number
          format: decimal
          exclusiveMinimum: true
          minimum: 0
          description: Monto a retirar. Debe ser mayor a 0.
          example: 200.00
        description:
          type: string
          description: Descripción opcional del motivo del retiro.
          nullable: true
          example: "Retiro en cajero"
        channel:
          type: string
          description: Canal desde donde se realiza el retiro.
          enum:
            - BRANCH
            - ATM
            - MOBILE
            - WEB
          example: "ATM"
        referenceId:
          type: string
          description: Referencia externa para trazabilidad del retiro.
          nullable: true
          example: "REF002"

    MovementResponse:
      type: object
      description: Respuesta con los detalles de un movimiento bancario.
      properties:
        movementId:
          type: string
          description: Identificador único del movimiento.
          example: "MOV001"
        accountId:
          type: string
          description: Identificador de la cuenta asociada al movimiento.
          example: "ACC001"
        movementType:
          type: string
          description: Tipo de movimiento realizado.
          enum:
            - DEPOSIT
            - WITHDRAWAL
            - TRANSFER_IN
            - TRANSFER_OUT
            - COMMISSION
            - PAYMENT
            - INTEREST
          example: "DEPOSIT"
        amount:
          type: number
          format: decimal
          description: Monto del movimiento.
          example: 500.00
        balanceAfter:
          type: number
          format: decimal
          description: Saldo de la cuenta después de ejecutar el movimiento.
          example: 1500.00
        commission:
          type: number
          format: decimal
          description: Comisión aplicada al movimiento. 0 si no se aplicó comisión.
          example: 0.00
        description:
          type: string
          description: Descripción del motivo del movimiento.
          example: "Depósito de sueldo"
        occurredAt:
          type: string
          format: date-time
          description: Fecha y hora en que ocurrió el movimiento.
          example: "2026-11-14T10:30:00"

    BalanceResponse:
      type: object
      description: Respuesta con el saldo disponible de una cuenta bancaria.
      properties:
        accountId:
          type: string
          description: Identificador único de la cuenta.
          example: "ACC001"
        balance:
          type: number
          format: decimal
          description: Saldo disponible actual de la cuenta.
          example: 1000.00
        currency:
          type: string
          description: Moneda del saldo.
          enum:
            - PEN
            - USD
          example: "PEN"
        cached:
          type: boolean
          description: Indica si el valor fue obtenido desde caché Redis (true) o directamente desde MongoDB (false).
          example: false

    MovementCountResponse:
      type: object
      description: Respuesta con el contador de movimientos del mes actual.
      properties:
        accountId:
          type: string
          description: Identificador único de la cuenta.
          example: "ACC001"
        movementCount:
          type: integer
          description: Cantidad de movimientos del mes actual.
          example: 5
        month:
          type: string
          description: Mes al que corresponde el contador (formato yyyy-MM).
          example: "2026-11"

    PageResponseOfAccountResponse:
      type: object
      description: Respuesta paginada de cuentas.
      properties:
        content:
          type: array
          description: Lista de cuentas en la página actual.
          items:
            $ref: '#/components/schemas/AccountResponse'
        page:
          type: integer
          description: Número de página actual (base 0).
          example: 0
        size:
          type: integer
          description: Tamaño de la página (número de elementos por página).
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total de elementos disponibles en todas las páginas.
          example: 150
        totalPages:
          type: integer
          description: Total de páginas disponibles.
          example: 8
        first:
          type: boolean
          description: Indica si es la primera página.
          example: true
        last:
          type: boolean
          description: Indica si es la última página.
          example: false

    PageResponseOfMovementResponse:
      type: object
      description: Respuesta paginada de movimientos.
      properties:
        content:
          type: array
          description: Lista de movimientos en la página actual.
          items:
            $ref: '#/components/schemas/MovementResponse'
        page:
          type: integer
          description: Número de página actual (base 0).
          example: 0
        size:
          type: integer
          description: Tamaño de la página (número de elementos por página).
          example: 20
        totalElements:
          type: integer
          format: int64
          description: Total de elementos disponibles en todas las páginas.
          example: 50
        totalPages:
          type: integer
          description: Total de páginas disponibles.
          example: 3
        first:
          type: boolean
          description: Indica si es la primera página.
          example: true
        last:
          type: boolean
          description: Indica si es la última página.
          example: false

    ApiError:
      type: object
      description: Estructura unificada de respuesta de error para toda la API.
      properties:
        timestamp:
          type: string
          format: date-time
          description: Fecha y hora del error.
          example: "2026-11-14T10:30:00"
        status:
          type: integer
          description: Código de estado HTTP.
          example: 400
        error:
          type: string
          description: Descripción corta del error.
          example: "Bad Request"
        code:
          type: string
          description: Código de error de negocio para identificación programática.
          example: "INVALID_ACCOUNT_TYPE"
        message:
          type: string
          description: Mensaje legible del error en español.
          example: "Tipo de cuenta inválido"
        path:
          type: string
          description: Ruta del endpoint que generó el error.
          example: "/api/accounts"
        details:
          type: object
          description: Detalles adicionales del error, como campos inválidos en validaciones.
          nullable: true
          additionalProperties: true

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT emitido por el API Gateway. En desarrollo local, puede omitirse.

security:
  - BearerAuth: []
